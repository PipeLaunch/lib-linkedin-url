name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Protect this environment in repo Settings -> Environments: add yourself
    # as required reviewer so every publish waits for manual approval.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, needed for the ancestry check below
      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to a commit that is not on main — refusing to publish."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # trusted publishing needs npm >= 11.5.1; keep the runner on latest
      - run: npm install -g npm@latest
      - run: npm ci
      # prepublishOnly runs the full gate (format, lint, typecheck, tests,
      # build, publint) before anything is uploaded. Auth is via OIDC —
      # no token, no OTP; provenance is attached automatically.
      - run: npm publish
